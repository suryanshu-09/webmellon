version: "3.8"

services:
  db:
    container_name: webmellon-postgres
    image: postgres:17
    restart: unless-stopped
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mysecretpassword
    ports:
      - "5432:5432"
    networks:
      - prisma-network
      - monitoring # Add to monitoring network
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: postgres -c listen_addresses='*'

  web:
    container_name: webmellon-app
    image: suryanshu09/webmellon:latest
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:mysecretpassword@db:5432/postgres
    env_file:
      - .env
    command: >
      sh -c "npx prisma migrate deploy && npx prisma generate && npm run dev"
    networks:
      - prisma-network
      - monitoring # Add to monitoring network

  prometheus:
    container_name: webmellon-prometheus
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-storage:/prometheus
    networks:
      - monitoring
    depends_on:
      - web

  grafana:
    container_name: webmellon-grafana
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - monitoring
    depends_on:
      - prometheus

networks:
  prisma-network:
    driver: bridge
  monitoring:
    driver: bridge

volumes:
  pgdata:
  grafana-storage:
  prometheus-storage:
